<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070510"/>
      <stop offset="50%" stop-color="#110926"/>
      <stop offset="100%" stop-color="#1a0618"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#a855f7" stroke-width="0.6" stroke-opacity="0.12"/>
    </pattern>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="16" fill="url(#grid)"/>

  <!-- Cyber HUD Corner Brackets -->
  <path d="M 24 60 L 24 24 L 60 24" fill="none" stroke="#a855f7" stroke-width="2.5" filter="url(#neon)"/>
  <path d="M 1176 60 L 1176 24 L 1140 24" fill="none" stroke="#ef4444" stroke-width="2.5" filter="url(#neon)"/>
  <path d="M 24 260 L 24 296 L 60 296" fill="none" stroke="#ef4444" stroke-width="2.5" filter="url(#neon)"/>
  <path d="M 1176 260 L 1176 296 L 1140 296" fill="none" stroke="#a855f7" stroke-width="2.5" filter="url(#neon)"/>

  <!-- Top Telemetry Bar -->
  <text x="45" y="46" fill="#a855f7" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" letter-spacing="2">
    SYS.NODE // BELÉM-PA-BR // KERNEL 7.3.3-FC45 // WAYLAND
  </text>
  <text x="1155" y="46" fill="#ef4444" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold" text-anchor="end" letter-spacing="2">
    [ STATUS: ONLINE // GEN'EI RYODAN NO.0 ]
  </text>
  <line x1="45" y1="58" x2="1155" y2="58" stroke="url(#accent)" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Animated Circuit / Telemetry Wave on Right -->
  <g opacity="0.22" transform="translate(880, 65)">
    <polygon points="100,15 175,58 175,142 100,185 25,142 25,58" fill="none" stroke="#a855f7" stroke-width="2"/>
    <polygon points="100,35 158,68 158,132 100,165 42,132 42,68" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4"/>
    <line x1="100" y1="0" x2="100" y2="200" stroke="#a855f7" stroke-width="1"/>
    <line x1="0" y1="100" x2="200" y2="100" stroke="#a855f7" stroke-width="1"/>
    <circle cx="100" cy="100" r="18" fill="none" stroke="#ef4444" stroke-width="2"/>
  </g>

  <!-- Main Name & Title -->
  <text x="60" y="142" fill="#f8fafc" font-family="JetBrains Mono, Segoe UI, sans-serif" font-size="52" font-weight="900" letter-spacing="3" filter="url(#neon)">
    AMYR INDEQUI
  </text>

  <!-- Subtitle -->
  <text x="62" y="182" fill="#e9d5ff" font-family="JetBrains Mono, monospace" font-size="17" font-weight="600" letter-spacing="1.5">
    ⚡ ENGENHARIA ELÉTRICA &amp; SISTEMAS DE INFORMAÇÃO (UFRA)
  </text>

  <!-- Specialization Tags -->
  <g transform="translate(60, 206)">
    <rect x="0" y="0" width="250" height="32" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="125" y="21" fill="#e9d5ff" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="bold" text-anchor="middle">
      📡 ESP32 / LoRa / Embarcados
    </text>

    <rect x="264" y="0" width="230" height="32" rx="6" fill="#31102f" stroke="#ef4444" stroke-width="1.2"/>
    <text x="379" y="21" fill="#fecaca" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="bold" text-anchor="middle">
      🏎️ Telemetria Baja SAE
    </text>

    <rect x="508" y="0" width="220" height="32" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.2"/>
    <text x="618" y="21" fill="#e9d5ff" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="bold" text-anchor="middle">
      🐧 Linux / Fedora Ricing
    </text>

    <rect x="742" y="0" width="210" height="32" rx="6" fill="#31102f" stroke="#ef4444" stroke-width="1.2"/>
    <text x="847" y="21" fill="#fecaca" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="bold" text-anchor="middle">
      📐 Modelagem CAD 3D
    </text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="60" y="264" width="1080" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="286" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="1.5">
    HARDWARE TELEMETRY // EMBEDDED FIRMWARE // 3D PROTOTYPING // OPEN SOURCE
  </text>
</svg>
